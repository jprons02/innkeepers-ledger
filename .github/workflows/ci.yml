name: ci

# Lint, tests, the vendored-library check and the forbidden-API check. Every job name
# here is a required status check on main and dev (CLAUDE.md -> Branch flow); renaming
# a job means updating branch protection too. Actions are pinned by commit SHA.
# Toolchain comes from apt and luarocks.org only, at the versions in CONTRIBUTING.md.

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0-1
      - name: luacheck
        run: |
          luacheck --version
          luacheck .

  busted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1 and busted
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install busted 2.3.0-1
      - name: busted
        run: |
          # The WoW client runs Lua 5.1; make sure busted does too.
          lua5.1 -v
          head -n 1 "$(command -v busted)"
          grep -q 'lua5\.1' "$(command -v busted)"
          busted --version
          busted

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1, busted and luacov
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install busted 2.3.0-1
          sudo luarocks --lua-version=5.1 install luacov 0.17.0-1
      - name: Coverage floors for pure modules
        run: |
          # The long #sim runs add minutes under luacov and no pure-module lines; the
          # busted job runs them.
          busted --coverage --exclude-tags=sim
          luacov
          sh scripts/check-coverage.sh

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check doc links and the context map
        run: sh scripts/check-links.sh

  libs-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Libs/ against the manifest and the review doc
        run: sh scripts/check-libs.sh

  forbidden-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shipped code for forbidden APIs
        run: sh scripts/check-apis.sh
