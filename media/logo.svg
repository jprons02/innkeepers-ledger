<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3b4a86"/>
      <stop offset="0.55" stop-color="#1f2752"/>
      <stop offset="1" stop-color="#0c1027"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf6e" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffcf6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#f4a63a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e3a35"/>
      <stop offset="1" stop-color="#5a2224"/>
    </linearGradient>
    <linearGradient id="plaster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe2c4"/>
      <stop offset="1" stop-color="#cdb98f"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7a3c"/>
      <stop offset="1" stop-color="#1c3a1f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06a35"/>
      <stop offset="1" stop-color="#6e4421"/>
    </linearGradient>
    <mask id="crescent"><rect width="500" height="500" fill="#fff"/><circle cx="427" cy="80" r="33" fill="#000"/></mask>
    <clipPath id="frame"><rect width="500" height="500" rx="64"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Night sky -->
    <rect width="500" height="500" fill="url(#sky)"/>
    <g fill="#fff6d8">
      <circle cx="58" cy="70" r="2.2"/><circle cx="120" cy="40" r="1.6"/>
      <circle cx="175" cy="88" r="1.8"/><circle cx="300" cy="36" r="2"/>
      <circle cx="455" cy="170" r="1.7"/><circle cx="40" cy="160" r="1.5"/>
      <circle cx="350" cy="120" r="1.4"/><circle cx="470" cy="60" r="1.8"/>
      <circle cx="215" cy="30" r="1.3"/><circle cx="90" cy="120" r="1.2"/>
    </g>
    <!-- Crescent moon -->
    <circle cx="410" cy="92" r="36" fill="#fbefc4" mask="url(#crescent)"/>

    <!-- Hill -->
    <path d="M-10 392 Q 120 370 250 380 Q 390 390 510 366 L 510 510 L -10 510 Z" fill="url(#hill)"/>
    <path d="M230 392 L270 392 L318 510 L182 510 Z" fill="#a7865a"/>
    <path d="M236 392 L264 392 L296 510 L204 510 Z" fill="#bd9a69"/>
    <g transform="translate(0,28)">

    <!-- Warm glow behind the inn -->
    <ellipse cx="250" cy="300" rx="210" ry="150" fill="url(#glow)" opacity="0.35"/>

    <!-- Chimney and smoke -->
    <rect x="322" y="84" width="32" height="80" fill="#857c70" stroke="#3a2a20" stroke-width="4"/>
    <rect x="316" y="76" width="44" height="14" rx="3" fill="#6f675c" stroke="#3a2a20" stroke-width="4"/>
    <g fill="#c9c6d6" opacity="0.55">
      <circle cx="342" cy="58" r="11"/><circle cx="356" cy="40" r="13"/><circle cx="374" cy="22" r="15"/>
    </g>

    <!-- Roof -->
    <path d="M86 190 L250 62 L414 190 Z" fill="url(#roof)" stroke="#2f1712" stroke-width="7" stroke-linejoin="round"/>
    <g stroke="#3e1a18" stroke-width="3" opacity="0.6">
      <line x1="208" y1="95" x2="292" y2="95"/>
      <line x1="170" y1="125" x2="330" y2="125"/>
      <line x1="132" y1="155" x2="368" y2="155"/>
    </g>
    <!-- Round gable window -->
    <circle cx="250" cy="132" r="19" fill="url(#win)" stroke="#3a2416" stroke-width="5"/>
    <line x1="250" y1="113" x2="250" y2="151" stroke="#3a2416" stroke-width="3"/>
    <line x1="231" y1="132" x2="269" y2="132" stroke="#3a2416" stroke-width="3"/>

    <!-- Upper floor (overhanging) -->
    <rect x="104" y="186" width="292" height="78" fill="url(#plaster)" stroke="#3a2416" stroke-width="6"/>
    <g stroke="#4a2f1f" stroke-width="7" stroke-linecap="square">
      <line x1="104" y1="264" x2="396" y2="264"/>
      <line x1="178" y1="190" x2="178" y2="262"/>
      <line x1="322" y1="190" x2="322" y2="262"/>
      <line x1="108" y1="194" x2="140" y2="258"/>
      <line x1="392" y1="194" x2="360" y2="258"/>
    </g>
    <!-- Upper windows -->
    <g stroke="#3a2416" stroke-width="5">
      <rect x="140" y="204" width="30" height="40" rx="3" fill="url(#win)"/>
      <rect x="226" y="200" width="48" height="46" rx="3" fill="url(#win)"/>
      <rect x="330" y="204" width="30" height="40" rx="3" fill="url(#win)"/>
    </g>
    <g stroke="#3a2416" stroke-width="3">
      <line x1="155" y1="204" x2="155" y2="244"/><line x1="140" y1="224" x2="170" y2="224"/>
      <line x1="250" y1="200" x2="250" y2="246"/><line x1="226" y1="223" x2="274" y2="223"/>
      <line x1="345" y1="204" x2="345" y2="244"/><line x1="330" y1="224" x2="360" y2="224"/>
    </g>

    <!-- Ground floor -->
    <rect x="118" y="268" width="264" height="74" fill="url(#plaster)" stroke="#3a2416" stroke-width="6"/>
    <g stroke="#4a2f1f" stroke-width="7">
      <line x1="200" y1="270" x2="200" y2="340"/>
      <line x1="300" y1="270" x2="300" y2="340"/>
    </g>
    <!-- Ground windows -->
    <g stroke="#3a2416" stroke-width="5" fill="url(#win)">
      <rect x="136" y="282" width="46" height="36" rx="3"/>
      <rect x="318" y="282" width="46" height="36" rx="3"/>
    </g>
    <g stroke="#3a2416" stroke-width="3">
      <line x1="159" y1="282" x2="159" y2="318"/><line x1="136" y1="300" x2="182" y2="300"/>
      <line x1="341" y1="282" x2="341" y2="318"/><line x1="318" y1="300" x2="364" y2="300"/>
    </g>
    <!-- Door -->
    <path d="M226 342 L226 298 Q250 272 274 298 L274 342 Z" fill="#6b4226" stroke="#2f1d12" stroke-width="5"/>
    <line x1="250" y1="284" x2="250" y2="342" stroke="#2f1d12" stroke-width="3"/>
    <circle cx="262" cy="318" r="3" fill="#e9c46a"/>
    <path d="M226 342 L274 342 L282 352 L218 352 Z" fill="#ffd27a" opacity="0.5"/>

    <!-- Stone foundation -->
    <rect x="112" y="340" width="276" height="26" fill="#8a8173" stroke="#3a2a20" stroke-width="5"/>
    <g stroke="#5a5247" stroke-width="2.5">
      <line x1="150" y1="342" x2="150" y2="364"/><line x1="196" y1="342" x2="196" y2="364"/>
      <line x1="304" y1="342" x2="304" y2="364"/><line x1="350" y1="342" x2="350" y2="364"/>
      <line x1="114" y1="353" x2="386" y2="353"/>
    </g>

    <!-- Lantern by the door -->
    <ellipse cx="292" cy="296" rx="22" ry="22" fill="url(#glow)"/>
    <rect x="286" y="288" width="12" height="16" rx="2" fill="#ffd36b" stroke="#2f1d12" stroke-width="3"/>

    <!-- Sign bracket and hanging sign: an open ledger and a quill -->
    <path d="M104 214 L44 214" stroke="#2b1c13" stroke-width="7" stroke-linecap="round"/>
    <path d="M104 238 L70 214" stroke="#2b1c13" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#2b1c13" stroke-width="3">
      <line x1="38" y1="214" x2="38" y2="234"/>
      <line x1="94" y1="214" x2="94" y2="234"/>
    </g>
    <rect x="24" y="232" width="84" height="64" rx="9" fill="url(#wood)" stroke="#2b1c13" stroke-width="5"/>
    <!-- Ledger -->
    <path d="M66 285 Q52 276 36 280 L36 252 Q52 248 66 257 Z" fill="#f5e9c8" stroke="#3a2416" stroke-width="3" stroke-linejoin="round"/>
    <path d="M66 285 Q80 276 96 280 L96 252 Q80 248 66 257 Z" fill="#efe0b6" stroke="#3a2416" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#8a6a44" stroke-width="2">
      <line x1="42" y1="262" x2="60" y2="265"/><line x1="42" y1="269" x2="60" y2="272"/>
      <line x1="72" y1="265" x2="88" y2="262"/>
    </g>
    <!-- Quill -->
    <path d="M100 240 Q86 252 76 274" stroke="#3a2416" stroke-width="2.5" fill="none"/>
    <path d="M102 236 Q94 240 88 254 Q84 262 78 268 Q90 262 96 252 Q102 244 102 236 Z" fill="#ffffff" stroke="#3a2416" stroke-width="2"/>
    </g>
    <g fill="#2f6a33" stroke="#173a1b" stroke-width="4">
      <circle cx="104" cy="392" r="20"/><circle cx="128" cy="398" r="15"/>
      <circle cx="396" cy="392" r="20"/><circle cx="372" cy="398" r="15"/>
    </g>
    <g fill="#e05a6a">
      <circle cx="98" cy="386" r="3"/><circle cx="112" cy="396" r="3"/>
      <circle cx="400" cy="384" r="3"/><circle cx="388" cy="397" r="3"/>
    </g>
  </g>

  <!-- Frame -->
  <rect x="5" y="5" width="490" height="490" rx="60" fill="none" stroke="#c99a4b" stroke-width="10"/>
  <rect x="14" y="14" width="472" height="472" rx="52" fill="none" stroke="#3a2416" stroke-width="3" opacity="0.7"/>
</svg>
